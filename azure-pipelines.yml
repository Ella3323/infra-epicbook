# EpicBook Infrastructure Pipeline
# Validate -> Plan -> Manual approval -> Apply (same reviewed plan) -> Outputs
# AWS credentials and DB credentials come ONLY from secret variable groups.

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - terraform
      - azure-pipelines.yml

pr: none

variables:
  - group: Epicbook-aws-secrets     # awsAccessKeyId, awsSecretAccessKey (secret)
  - group: Epicbook-mysql-secrets   # mysqlAdminUsername, mysqlAdminPassword (secret)
  - name: terraformVersion
    value: '1.15.7'                 # same version used locally
  - name: awsRegion
    value: 'us-east-1'
  - name: tfStateBucket
    value: 'epicbook-tfstate-ella-21849'
  - name: tfStateKey
    value: 'epicbook/terraform.tfstate'
  - name: tfStateLockTable
    value: 'epicbook-tfstate-lock'
  - name: tfDir
    value: '$(System.DefaultWorkingDirectory)/terraform'
  - name: TF_IN_AUTOMATION
    value: 'true'
  - name: TF_INPUT
    value: '0'

pool:
  vmImage: 'ubuntu-latest'

stages:
# ---------------------------------------------------------------------------
- stage: Validate
  displayName: 'Validate'
  jobs:
  - job: Validate
    displayName: 'Terraform fmt + validate'
    steps:
    - checkout: self

    # Installed into the temp dir to avoid clashing with any existing
    # "terraform" folder in the working directory on hosted agents.
    - script: |
        set -euo pipefail
        cd "$(Agent.TempDirectory)"
        curl -fsSL -o tf.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -o -q tf.zip -d tfbin
        sudo install -m 0755 tfbin/terraform /usr/local/bin/terraform
        terraform version
      displayName: 'Install Terraform $(terraformVersion)'

    - script: |
        set -euo pipefail
        terraform init -input=false \
          -backend-config="bucket=$(tfStateBucket)" \
          -backend-config="key=$(tfStateKey)" \
          -backend-config="region=$(awsRegion)" \
          -backend-config="dynamodb_table=$(tfStateLockTable)" \
          -backend-config="encrypt=true"
      displayName: 'Terraform init (S3 remote backend)'
      workingDirectory: $(tfDir)
      env:
        AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
        AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
        AWS_DEFAULT_REGION: $(awsRegion)

    - script: terraform fmt -check -recursive
      displayName: 'Terraform fmt -check'
      workingDirectory: $(tfDir)

    - script: terraform validate
      displayName: 'Terraform validate'
      workingDirectory: $(tfDir)

# ---------------------------------------------------------------------------
- stage: Plan
  displayName: 'Plan'
  dependsOn: Validate
  jobs:
  - job: Plan
    displayName: 'Terraform plan'
    steps:
    - checkout: self

    # Each stage runs on a fresh disposable agent, so install + init again.
    - script: |
        set -euo pipefail
        cd "$(Agent.TempDirectory)"
        curl -fsSL -o tf.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -o -q tf.zip -d tfbin
        sudo install -m 0755 tfbin/terraform /usr/local/bin/terraform
        terraform version
      displayName: 'Install Terraform $(terraformVersion)'

    - script: |
        set -euo pipefail
        terraform init -input=false \
          -backend-config="bucket=$(tfStateBucket)" \
          -backend-config="key=$(tfStateKey)" \
          -backend-config="region=$(awsRegion)" \
          -backend-config="dynamodb_table=$(tfStateLockTable)" \
          -backend-config="encrypt=true"
        terraform plan -input=false -var-file="terraform.tfvars" -out=tfplan
      displayName: 'Terraform init + plan (saved to tfplan)'
      workingDirectory: $(tfDir)
      env:
        AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
        AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
        AWS_DEFAULT_REGION: $(awsRegion)
        TF_VAR_db_admin_username: $(mysqlAdminUsername)
        TF_VAR_db_admin_password: $(mysqlAdminPassword)

    # Publish ONLY the plan file - never terraform.tfstate
    - publish: $(tfDir)/tfplan
      artifact: tfplan
      displayName: 'Publish reviewed plan (tfplan only)'

# ---------------------------------------------------------------------------
- stage: Apply
  displayName: 'Apply (requires approval)'
  dependsOn: Plan
  jobs:
  - deployment: Apply
    displayName: 'Terraform apply reviewed plan'
    environment: 'epicbook-infra-approval'   # approval check configured in the UI
    strategy:
      runOnce:
        deploy:
          steps:
          - checkout: self                   # deployment jobs don't check out by default

          - download: current
            artifact: tfplan
            displayName: 'Download reviewed plan'

          - script: |
              set -euo pipefail
              cd "$(Agent.TempDirectory)"
              curl -fsSL -o tf.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
              unzip -o -q tf.zip -d tfbin
              sudo install -m 0755 tfbin/terraform /usr/local/bin/terraform
              terraform version
            displayName: 'Install Terraform $(terraformVersion)'

          # Apply the SAME plan that was reviewed - no new plan is generated.
          - script: |
              set -euo pipefail
              terraform init -input=false \
                -backend-config="bucket=$(tfStateBucket)" \
                -backend-config="key=$(tfStateKey)" \
                -backend-config="region=$(awsRegion)" \
                -backend-config="dynamodb_table=$(tfStateLockTable)" \
                -backend-config="encrypt=true"
              terraform apply -input=false -auto-approve "$(Pipeline.Workspace)/tfplan/tfplan"
            displayName: 'Terraform init + apply tfplan'
            workingDirectory: $(tfDir)
            env:
              AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
              AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
              AWS_DEFAULT_REGION: $(awsRegion)

          - script: |
              echo "##[error]Terraform apply failed. Open the 'Terraform init + apply tfplan' step above for the real AWS error"
              echo "(common causes: permissions, quota, instance/DB class availability, or a stale plan)."
            displayName: 'Explain apply failure'
            condition: failed()

# ---------------------------------------------------------------------------
- stage: Outputs
  displayName: 'Outputs'
  dependsOn: Apply
  jobs:
  - job: Outputs
    displayName: 'Show non-sensitive outputs'
    steps:
    - checkout: self

    - script: |
        set -euo pipefail
        cd "$(Agent.TempDirectory)"
        curl -fsSL -o tf.zip "https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip"
        unzip -o -q tf.zip -d tfbin
        sudo install -m 0755 tfbin/terraform /usr/local/bin/terraform
      displayName: 'Install Terraform $(terraformVersion)'

    - script: |
        set -euo pipefail
        terraform init -input=false \
          -backend-config="bucket=$(tfStateBucket)" \
          -backend-config="key=$(tfStateKey)" \
          -backend-config="region=$(awsRegion)" \
          -backend-config="dynamodb_table=$(tfStateLockTable)" \
          -backend-config="encrypt=true" > /dev/null
        echo "=============================================================="
        echo " EpicBook infrastructure outputs (copy these for the handoff)"
        echo "=============================================================="
        echo "app_public_ip        = $(terraform output -raw app_public_ip)"
        echo "backend_ansible_host = $(terraform output -raw backend_ansible_host)"
        echo "backend_private_ip   = $(terraform output -raw backend_private_ip)"
        echo "mysql_fqdn           = $(terraform output -raw mysql_fqdn)"
        echo "=============================================================="
      displayName: 'Print infrastructure outputs'
      workingDirectory: $(tfDir)
      env:
        AWS_ACCESS_KEY_ID: $(awsAccessKeyId)
        AWS_SECRET_ACCESS_KEY: $(awsSecretAccessKey)
        AWS_DEFAULT_REGION: $(awsRegion)
